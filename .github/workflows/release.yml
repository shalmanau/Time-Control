name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: node scripts/check-release-version.mjs
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      - run: npm test && npm run test:release && cargo test -p ledger-core --locked
      - name: Build signed AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Configure release secrets first'; exit 1; }
          npm run tauri -- build --bundles appimage
          image=$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)
          test -n "$image"
          node scripts/package-release.mjs linux "$image" "$image.sig" release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: release-assets/
          if-no-files-found: error
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: node scripts/check-release-version.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          key: android
      - run: npm ci
      - name: Build and verify signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          LEDGER_KEY_ALIAS: ${{ secrets.LEDGER_KEY_ALIAS }}
          LEDGER_STORE_PASSWORD: ${{ secrets.LEDGER_STORE_PASSWORD }}
          LEDGER_KEY_PASSWORD: ${{ secrets.LEDGER_KEY_PASSWORD }}
          ANDROID_MANIFEST_PRIVATE_KEY: ${{ secrets.ANDROID_MANIFEST_PRIVATE_KEY }}
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export LEDGER_KEYSTORE="$RUNNER_TEMP/android.keystore"
          export LEDGER_MANIFEST_KEY="$RUNNER_TEMP/android-manifest.pem"
          trap 'rm -f "$LEDGER_KEYSTORE" "$LEDGER_MANIFEST_KEY"' EXIT
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          for (const name of ['ANDROID_KEYSTORE_BASE64','ANDROID_MANIFEST_PRIVATE_KEY','LEDGER_KEY_ALIAS','LEDGER_STORE_PASSWORD','LEDGER_KEY_PASSWORD']) {
            if (!process.env[name]) throw new Error(`Missing secret ${name}`);
          }
          writeFileSync(process.env.LEDGER_KEYSTORE, Buffer.from(process.env.ANDROID_KEYSTORE_BASE64,'base64'), {mode:0o600});
          writeFileSync(process.env.LEDGER_MANIFEST_KEY, process.env.ANDROID_MANIFEST_PRIVATE_KEY, {mode:0o600});
          JS
          npm run tauri -- android build --apk --target aarch64 --ci
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release.apk' -print -quit)
          test -n "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
          code=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          node scripts/package-release.mjs android "$apk" "$code" release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-assets/
          if-no-files-found: error
  publish:
    needs: [linux, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          merge-multiple: true
          path: release-assets
      - name: Publish only after both signed builds succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/check-release-version.mjs
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true || { echo 'This version is already published. Create a new version.'; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Time Ledger $GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
